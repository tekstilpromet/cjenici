<!DOCTYPE html>

<head>

    <title>Arhiva CSV Datoteka</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }

        details { background: #f9f9f9; padding: 10px; margin-bottom: 8px; border-radius: 5px; border: 1px solid #ddd; }

        li { margin: 6px 0; }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Arhiva CSV Datoteka po Datumima</h1>

        <summary>2026-10-30</summary>
